[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepaudit"
description = "DeepAudit 审计工作台：科目余额、TB 复核及附注与底稿工作流"
requires-python = ">=3.12"
dynamic = ["dependencies", "version"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "tb_autofill.__version__"}

[tool.setuptools.packages.find]
include = ["tb_autofill*"]

[tool.setuptools.package-data]
tb_autofill = ["assets/*.png"]

[project.gui-scripts]
deepaudit = "tb_autofill.gui:main"
zszh-tb-autofill = "tb_autofill.gui:main"
