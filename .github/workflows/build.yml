name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

  build:
    name: 构建 EXE 并发布
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: 打包
        run: pyinstaller packaging/zszh-tb-autofill.spec --noconfirm --distpath dist --workpath build
      - name: 生成校验值与安装说明
        shell: pwsh
        run: |
          $exe = "dist/ZSZH-TB自动填写.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "未生成 $exe" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ZSZH-TB自动填写.exe" | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding utf8
          Copy-Item -LiteralPath "packaging/安装说明.txt" -Destination "dist/安装说明.txt" -Force
          Get-Content -LiteralPath "dist/SHA256SUMS.txt"
          Get-Item -LiteralPath $exe | Select-Object Name, Length
      - name: 上传运行产物
        uses: actions/upload-artifact@v4
        with:
          name: zszh-tb-autofill
          if-no-files-found: error
          path: |
            dist/ZSZH-TB自动填写.exe
            dist/SHA256SUMS.txt
            dist/安装说明.txt
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag "dist/ZSZH-TB自动填写.exe" "dist/SHA256SUMS.txt" "dist/安装说明.txt" --clobber
          gh release view $tag --json assets --jq '.assets[].name'
