name: DeepAudit Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepaudit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

  build:
    name: 原生编译与发布校验
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: 原生编译、离线自检与校验值
        run: python tools/build_release.py --compiler msvc --jobs 2
      - name: 上传运行产物
        uses: actions/upload-artifact@v4
        with:
          name: DeepAudit-windows-x64
          if-no-files-found: error
          path: |
            dist/DeepAudit.exe
            dist/SHA256SUMS.txt
            dist/INSTALL.txt
            dist/BUILDINFO.json
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "DeepAudit $tag" --notes-file docs/release-v0.4.0.md
          }
          gh release upload $tag "dist/DeepAudit.exe" "dist/SHA256SUMS.txt" "dist/INSTALL.txt" "dist/BUILDINFO.json" --clobber
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
